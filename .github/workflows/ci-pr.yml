name: ci-pr
run-name: ${{ github.head_ref || github.ref_name }}-ci-pr

on: # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - "**.jpg"
      - "**.png"
  pull_request_review:
    types: [submitted]
  workflow_dispatch:


concurrency:
  group: >-
    ci-pr-${{ github.event.pull_request.number || github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Bot pull requests pass this gate only after a maintainer approves the current head commit.
  approval:
    if: >-
      ${{ github.event_name != 'pull_request_review'
          || github.event.pull_request.user.login == 'gdunit4-bot[bot]' }}
    name: "✅ Approval"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 1
    permissions:
      pull-requests: read
    steps:
      - name: 'Check for an approved review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: >-
            ${{ github.event.pull_request.number || github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$PR_AUTHOR" != "gdunit4-bot[bot]" ]]; then
            echo "No approval gate is required for this pull request."
            exit 0
          fi

          reviews=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")
          approved=$(jq --arg head "$PR_HEAD_SHA" --arg author "$PR_AUTHOR" \
            'add | group_by(.user.login) | map(max_by(.submitted_at))
             | any(.[]; .user.login != $author
               and .state == "APPROVED" and .commit_id == $head)' \
            <<< "$reviews")
          if [[ "$approved" != "true" ]]; then
            echo "::error::Approve this pull request commit before CI runs."
            exit 1
          fi
          echo "The current pull request commit has an approving review."

  setup-dotnet:
    name: "🔧 Setup .NET"
    needs: approval
    runs-on: "ubuntu-24.04"
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: "global.json"

  compile:
    name: "🔨 Compile Projects"
    needs: setup-dotnet
    runs-on: "ubuntu-24.04"
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "global.json"

      - name: "Build Projects"
        run: |
          dotnet restore
          dotnet build

      - name: "Cache Build Output"
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/.godot
            **/nupkg
            ~/.nuget/packages
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

  example-tests:
    name: "🧪 Example Tests"
    needs: compile
    runs-on: "ubuntu-24.04"
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "global.json"

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/.godot
            **/nupkg
            ~/.nuget/packages
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: "Install Godot Net"
        uses: ./.github/actions/godot-install
        with:
          godot-version: "4.7.2"
          godot-mono: true
          godot-status-version: "stable"
          godot-bin-name: "linux_x86_64"
          godot-cache-path: "~/godot-linux"

      - name: "Run Tests"
        if: ${{ !cancelled() }}
        env:
          GODOT_BIN: "/home/runner/godot-linux/godot"
        shell: bash
        run: |
          chmod +x ./.github/runtests.sh
          xvfb-run --auto-servernum ./.github/runtests.sh

      - name: "Upload Test Reports"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: 10
          name: example_report
          path: |
            ./TestResults/*.trx
            ./TestResults/*.html

  finalize:
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request_review'
            || github.event.pull_request.user.login == 'gdunit4-bot[bot]') }}
    runs-on: "ubuntu-24.04"
    name: Final Results
    needs: [approval, compile, example-tests]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
